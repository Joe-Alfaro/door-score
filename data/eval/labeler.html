<!doctype html><html><head><meta charset="utf-8"><title>Door Score — eval labeler</title>
<style>
body{font:14px system-ui;margin:0;display:grid;grid-template-columns:660px 1fr;height:100vh}
#img{width:640px;height:640px;object-fit:contain;background:#222;margin:10px}
#panel{padding:16px;overflow:auto}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row label{width:220px}
button{padding:6px 12px;margin-right:6px}
.k{display:inline-block;min-width:1.6em;padding:1px 6px;border:1px solid #999;border-radius:4px;font-family:monospace;background:#f4f4f4}
.draft{color:#b36b00;font-size:12px}
#progress{font-weight:600}
textarea{width:100%;height:50px}
</style></head><body>
<img id="img"/>
<div id="panel">
  <div id="progress"></div>
  <div id="addr" style="margin:4px 0 12px;color:#555"></div>
  <div id="fields"></div>
  <div class="row"><label>Note</label><textarea id="note"></textarea></div>
  <div style="margin-top:12px">
    <button onclick="mark(true)">✓ Verify &amp; next <span class="k">Enter</span></button>
    <button onclick="nav(-1)">◀ <span class="k">←</span></button>
    <button onclick="nav(1)">▶ <span class="k">→</span></button>
    <button onclick="download()">⬇ Download labels.jsonl</button>
    <button onclick="showDump()">Show JSONL on page</button>
  </div>
  <pre id="dump" style="display:none;white-space:pre;font-size:10px;max-height:300px;overflow:auto;border:1px solid #ccc;padding:6px"></pre>
  <p class="draft">Rows pre-filled by a draft model are shown with an orange marker until you verify them. Keys: 1-6 toggle the binary signals, U toggles usable. Progress autosaves in this browser.</p>
</div>
<script>
const BIN=['provider_truck','moving_indicators','yard_sign','renovation_activity','professional_landscaping','solar_panels']
const COND=['lawn_condition','exterior_condition','roof_condition']
const LEVELS=['poor','fair','good','excellent','not_visible']
let rows=[],i=0
const KEY='doorscore-labels'
async function load(){
  // Always read the sample file; keep only rows you have already verified from local storage,
  // so re-drafting or re-sampling never clobbers human work and never gets hidden by stale drafts.
  const txt=await (await fetch('sample.jsonl?'+Date.now())).text()
  const fresh=txt.trim().split('\n').map(l=>JSON.parse(l))
  const saved=localStorage.getItem(KEY)
  const keep=new Map(saved?JSON.parse(saved).filter(r=>r.verified_by_human).map(r=>[r.door_id,r]):[])
  rows=fresh.map(r=>keep.get(r.door_id)||r)
  i=Math.max(0,rows.findIndex(r=>!r.verified_by_human)); if(i<0)i=0
  render()
}
function save(){localStorage.setItem(KEY,JSON.stringify(rows))}
function render(){
  const r=rows[i]
  document.getElementById('img').src=r.image
  document.getElementById('progress').textContent=`${i+1} / ${rows.length} — verified ${rows.filter(x=>x.verified_by_human).length}`
  document.getElementById('addr').textContent=`${r.door_id} ${r.labeler?('· draft by '+r.labeler):''} ${r.verified_by_human?'· VERIFIED':''}`
  const f=document.getElementById('fields'); f.innerHTML=''
  f.appendChild(tri('image_usable','Image usable (shows a house frontage)','U'))
  BIN.forEach((k,n)=>f.appendChild(tri(k,k.replaceAll('_',' '),String(n+1))))
  COND.forEach(k=>{
    const d=document.createElement('div');d.className='row'
    d.innerHTML=`<label>${k.replaceAll('_',' ')}</label>`
    const s=document.createElement('select')
    s.innerHTML='<option value="">(unset)</option>'+LEVELS.map(l=>`<option ${r[k]===l?'selected':''}>${l}</option>`).join('')
    s.onchange=()=>{r[k]=s.value||null;save()}
    d.appendChild(s);f.appendChild(d)
  })
  document.getElementById('note').value=r.note||''
  document.getElementById('note').oninput=e=>{r.note=e.target.value;save()}
}
function tri(k,label,key){
  const r=rows[i];const d=document.createElement('div');d.className='row'
  d.innerHTML=`<label><span class="k">${key}</span> ${label}</label>`
  ;[['true','yes'],['false','no'],['null','can\'t tell']].forEach(([v,t])=>{
    const b=document.createElement('button');b.textContent=t
    const cur=r[k]===null?'null':String(r[k])
    b.style.fontWeight=cur===v?'700':'400';b.style.background=cur===v?'#cde':'';
    b.onclick=()=>{r[k]=JSON.parse(v);save();render()}
    d.appendChild(b)})
  return d
}
function mark(v){rows[i].verified_by_human=v;rows[i].labeler=(rows[i].labeler||'')+'+human';save();nav(1)}
function nav(d){i=Math.min(rows.length-1,Math.max(0,i+d));render()}
function download(){
  const blob=new Blob([rows.map(r=>JSON.stringify(r)).join('\n')+'\n'],{type:'application/jsonl'})
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='labels.jsonl';a.click()
}
function showDump(){const d=document.getElementById('dump');d.textContent=rows.map(r=>JSON.stringify(r)).join('\n');d.style.display='block'}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return
  const r=rows[i]
  if(e.key==='Enter')mark(true)
  else if(e.key==='ArrowLeft')nav(-1)
  else if(e.key==='ArrowRight')nav(1)
  else if(e.key.toLowerCase()==='u'){r.image_usable=r.image_usable===true?false:true;save();render()}
  else if('123456'.includes(e.key)){const k=BIN[+e.key-1];r[k]=r[k]===true?false:true;save();render()}
})
load()
</script></body></html>
